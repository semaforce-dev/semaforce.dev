<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SemaForce | Inquiry received</title>
    <meta
      name="description"
      content="SemaForce has received your inquiry and will follow up soon."
    />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#101817" />
    <link rel="canonical" href="https://semaforce.dev/thanks.html" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SemaForce" />
    <meta property="og:title" content="SemaForce | Inquiry received" />
    <meta property="og:description" content="SemaForce has received your inquiry and will follow up soon." />
    <meta property="og:url" content="https://semaforce.dev/thanks.html" />
    <meta property="og:image" content="https://semaforce.dev/assets/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://semaforce.dev/assets/social-card.png" />
    <script>
      (() => {
        try {
          const themePreference = localStorage.getItem("semaforce-theme") || "system";
          const languagePreference = localStorage.getItem("semaforce-language") || "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const prefersSpanish = navigator.language.toLowerCase().startsWith("es");

          document.documentElement.dataset.theme =
            themePreference === "dark" || (themePreference === "system" && prefersDark)
              ? "dark"
              : "light";
          document.documentElement.dataset.themePreference = themePreference;
          document.documentElement.lang =
            languagePreference === "es" || (languagePreference === "system" && prefersSpanish)
              ? "es"
              : "en";
          document.documentElement.dataset.languagePreference = languagePreference;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.themePreference = "system";
          document.documentElement.dataset.languagePreference = "system";
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="thanks-page">
    <main class="thanks-shell">
      <a class="brand dark-brand" href="/">SemaForce</a>
      <section class="thanks-card" aria-labelledby="thanks-title">
        <p class="section-kicker">Inquiry received</p>
        <h1 id="thanks-title">Thanks. We will follow up soon.</h1>
        <p>
          Your message was sent to SemaForce. We will respond shortly with next
          steps.
        </p>
        <a class="button primary" href="/">Back to SemaForce</a>
      </section>
    </main>
    <script>
      const languagePreference = (() => {
        try {
          return localStorage.getItem("semaforce-language") || "system";
        } catch (error) {
          return "system";
        }
      })();
      const language =
        languagePreference === "es" ||
        (languagePreference === "system" && navigator.language.toLowerCase().startsWith("es"))
          ? "es"
          : "en";

      if (language === "es") {
        document.documentElement.lang = "es";
        document.title = "SemaForce | Consulta recibida";
        document.querySelector(".section-kicker").textContent = "Consulta recibida";
        document.querySelector("#thanks-title").textContent = "Gracias. Responderemos pronto.";
        document.querySelector(".thanks-card p:not(.section-kicker)").textContent =
          "Tu mensaje fue enviado a SemaForce. Responderemos pronto con los siguientes pasos.";
        document.querySelector(".thanks-card .button").textContent = "Volver a SemaForce";
      }
    </script>
  </body>
</html>
